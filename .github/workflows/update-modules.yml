name: Update module repo

on:
  schedule:
    # 每天 UTC 00:30（北京时间 08:30）自动更新一次
    - cron: "30 0 * * *"
  workflow_dispatch: {} # 也支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate module repo data (A route)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: Audit open-source gate (进阶3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/validate.py

      - name: Build MMRL-compatible output (B route)
        run: python tools/build_mmrl.py

      - name: Sign artifacts (进阶2)
        env:
          SHIZUSU_SIGN_PRIVATE_KEY: ${{ secrets.SHIZUSU_SIGN_PRIVATE_KEY }}
        run: python tools/sign.py

      - name: Verify schema
        run: python verify_schema.py

      - name: Sync output to repo root (GitHub Pages serves root)
        run: cp -r output/. .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 每日模块仓库自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi

name: Update module repo

on:
  schedule:
    # 每天 UTC 00:30（北京时间 08:30）自动更新一次
    - cron: "30 0 * * *"
  workflow_dispatch: {} # 也支持手动触发

# 并发锁：同一时间只允许一个 run 提交产物，避免并发竞争把 catalog 与签名混合进同一提交
concurrency:
  group: update-modules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate module repo data (A route)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: Audit open-source gate (进阶3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/validate.py

      - name: Build MMRL-compatible output (B route)
        run: python tools/build_mmrl.py

      - name: Sign artifacts (进阶2)
        env:
          SHIZUSU_SIGN_PRIVATE_KEY: ${{ secrets.SHIZUSU_SIGN_PRIVATE_KEY }}
        run: python tools/sign.py

      - name: Verify schema
        run: python verify_schema.py

      - name: Sync output to repo root (GitHub Pages serves root)
        run: cp -r output/. .

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 每日模块仓库自动更新 $(date -u +%Y-%m-%d)"
            # 远端可能已有 discover 收录提交或同日另一次构建的产物提交。
            # 产物是每次全量重建的生成物，冲突时必须以本次构建为准，故用 merge -X ours；
            # 远端新增的 config/candidates 等非冲突文件会被正常合并进来。
            ok=0
            for i in 1 2 3; do
              git fetch origin main
              if git merge -X ours --no-edit origin/main && git push; then
                ok=1
                break
              fi
              git merge --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::产物推送失败（三次重试均未成功）"
              exit 1
            fi
          fi

name: Discover modules (topic scan)

on:
  schedule:
    # 每天 UTC 01:10（北京时间 09:10），避开 00:30 的构建任务
    - cron: "10 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan topics and auto-approve new modules (自动审核)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: discover
        run: |
          set +e
          out=$(python tools/discover.py --auto-approve 2>&1)
          rc=$?
          echo "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # rc=0 表示有新增/更新，rc=1 表示无变化
          if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
            exit $rc
          fi
          echo "changed=$([ $rc -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit auto-approved modules if changed
        if: steps.discover.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules.config.json catalog/candidates.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 自动审核收录新模块 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Trigger build pipeline (构建+签名+上线)
        if: steps.discover.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-modules.yml
          echo "已触发 update-modules.yml 构建管线"

      - name: Open alert issue when discovery fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "自动发现失败（$(date -u +%Y-%m-%d)）" \
            --label discovery \
            --body "topic 自动扫描或自动审核流程失败，请检查 Actions 日志。"
